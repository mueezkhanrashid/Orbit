<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" width="320" height="220" role="img">
  <title>ORBIT Pakistan map — Rawalpindi</title>
  <rect x="10" y="10" width="300" height="200" rx="16" fill="#F9F9F9" stroke="#EAEAEA" stroke-width="1.2"/>
  <!-- simplified Pakistan shape -->
  <path d="M90 40 L180 36 L210 70 L220 110 L200 150 L160 170 L110 160 L70 120 L60 70 Z" fill="none" stroke="#1F201D" stroke-width="1.6" stroke-linejoin="round"/>
  <!-- city dots -->
  <circle cx="138" cy="78" r="4" fill="#1B6E66" stroke="#FFFFFF" stroke-width="1.5"/> <!-- Rawalpindi -->
  <circle cx="155" cy="105" r="3" fill="#FFFFFF" stroke="#1F201D" stroke-width="1.2"/> <!-- Lahore -->
  <circle cx="145" cy="140" r="3" fill="#FFFFFF" stroke="#1F201D" stroke-width="1.2"/> <!-- Karachi -->
  <text x="138" y="68" text-anchor="middle" font-family="Instrument Sans, sans-serif" font-size="8" font-weight="600" fill="#1B6E66">Rawalpindi</text>
  <!-- job pill -->
  <rect x="220" y="44" width="74" height="22" rx="11" fill="#FFFFFF" stroke="#EAEAEA" stroke-width="1"/>
  <text x="257" y="59" text-anchor="middle" font-family="Inter, sans-serif" font-size="8" fill="#1F201D">3,800 jobs</text>
  <!-- scholarship pill -->
  <rect x="220" y="74" width="74" height="22" rx="11" fill="#E6F0EE" stroke="#1B6E66" stroke-width="1" stroke-opacity="0.18"/>
  <text x="257" y="89" text-anchor="middle" font-family="Inter, sans-serif" font-size="8" fill="#1B6E66">24 live RSS</text>
  <!-- bottom label -->
  <text x="160" y="192" text-anchor="middle" font-family="Inter, sans-serif" font-size="9" fill="#636361">Pakistan-first • GPS-ranked • On-device</text>
</svg>
