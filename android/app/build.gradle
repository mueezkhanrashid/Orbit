plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}
def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) { localPropertiesFile.withReader('UTF-8') { localProperties.load(it) } }
def flutterVersionCode = localProperties.getProperty('flutter.versionCode') ?: '1'
def flutterVersionName = localProperties.getProperty('flutter.versionName') ?: '1.0'
android {
    namespace "com.orbit.app"
    compileSdk 35
    ndkVersion "27.0.12077973"
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    kotlinOptions { jvmTarget = '17' }
    defaultConfig {
        applicationId "com.orbit.app"
        minSdkVersion 24
        targetSdkVersion 35
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
    }
    buildTypes { release { signingConfig signingConfigs.debug; minifyEnabled false; shrinkResources false } }
}
flutter { source '../..' }
configurations.all {
    resolutionStrategy {
        force 'androidx.glance:glance-appwidget:1.1.0'
        force 'androidx.glance:glance:1.1.0'
        force 'androidx.glance:glance-material3:1.1.0'
    }
}
dependencies {}
