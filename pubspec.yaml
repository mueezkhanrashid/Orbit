name: orbit
description: "ORBIT — Pakistan-first super-app. News, Jobs, Scholarships, Weather, Space, Markets, Quran, Namaz, Qibla, Notebook — Pakistan Super-App."
publish_to: 'none'
version: 1.5.29+42

environment:
  sdk: ">=3.2.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  dio: ^5.4.3
  cached_network_image: ^3.3.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.2.3
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  flutter_map: ^7.0.2
  latlong2: ^0.9.0
  geolocator: ^11.0.0
  permission_handler: ^11.3.1
  flutter_secure_storage: ^9.0.0
  local_auth: ^2.1.8
  encrypt: ^5.0.3
  flutter_compass: ^0.8.0
  just_audio: ^0.9.40
  flutter_animate: ^4.5.0
  home_widget: ^0.8.0
  workmanager: ^0.5.2
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.9

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
